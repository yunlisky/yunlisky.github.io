<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>回声车站 · ECHO STATION</title>
<meta name="description" content="1987 年冬，废弃铁路 K-17 信号站。像素风循环叙事游戏，6 个结局，可离线游玩。">
<meta name="theme-color" content="#0d0b14">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="回声车站">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --ink:#0d0b14; --deep:#181425; --slate:#262b44; --panel:#3a4466;
    --steel:#5a6988; --fog:#8b9bb4; --mist:#c0cbdc; --white:#ffffff;
    --cyan:#2ce8f5; --blue:#0099db; --navy:#124e89;
    --red:#e43b44; --amber:#feae34; --gold:#fee761; --green:#63c74d;
    --rust:#be4a2f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  html{background:var(--ink);}
  body{
    background:
      radial-gradient(circle at 50% 0%, #1d1830 0%, var(--ink) 60%),
      var(--ink);
    color:var(--mist);
    font-family:"Cascadia Mono","Consolas","Menlo","Courier New",ui-monospace,monospace;
    display:flex; align-items:center; justify-content:center;
    padding:14px;
    overflow:hidden;
    min-height:100dvh;
    overscroll-behavior:none;          /* 关掉 iOS 整页橡皮筋 */
    touch-action:manipulation;          /* 去掉双击缩放的 300ms 延迟 */
    -webkit-user-select:none; -moz-user-select:none; user-select:none;
    -webkit-touch-callout:none;         /* 长按不弹「拷贝/查询」菜单 */
  }
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply; opacity:.5;
  }
  #cab{
    width:100%; max-width:820px; position:relative;
    border:3px solid var(--panel);
    background:var(--deep);
    box-shadow:0 0 0 3px var(--ink), 0 0 42px rgba(44,232,245,.10), 0 18px 60px rgba(0,0,0,.7);
    display:flex; flex-direction:column;
    max-height:calc(100vh - 28px);
    max-height:calc(100dvh - 28px);
  }
  #bar{
    display:flex; align-items:center; gap:8px;
    padding:6px 10px; background:var(--slate);
    border-bottom:3px solid var(--ink); font-size:11px; letter-spacing:.14em;
    color:var(--fog); flex:0 0 auto;
  }
  #bar b{color:var(--cyan); font-weight:600; letter-spacing:.22em;}
  #bar .sp{flex:1}
  .tag{
    border:1px solid var(--steel); padding:1px 6px; color:var(--mist); font-size:10px;
  }
  .tag.hot{border-color:var(--red); color:var(--red);}
  .btn{
    cursor:pointer; border:1px solid var(--steel); background:transparent;
    color:var(--fog); font:inherit; font-size:10px; padding:2px 7px; letter-spacing:.1em;
  }
  .btn:hover{border-color:var(--cyan); color:var(--cyan);}
  #view{position:relative; background:#000; flex:0 0 auto; overflow:hidden;}
  #cv{
    display:block; width:100%; height:auto; image-rendering:pixelated;
    image-rendering:crisp-edges; background:#000;
  }
  #glow{
    position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 120%, rgba(44,232,245,.10), transparent 70%);
  }
  #box{
    flex:1 1 auto; overflow-y:auto; overflow-x:hidden;
    padding:14px 16px 16px; min-height:150px;
    border-top:3px solid var(--panel); background:linear-gradient(180deg,#1b1730,#141122);
    overscroll-behavior:contain;              /* 滚到底不再带动整页 */
    -webkit-overflow-scrolling:touch;         /* iOS 惯性滚动 */
    touch-action:pan-y;                       /* 纵向滚动交给浏览器，横向留给手势 */
  }
  #speaker{
    font-size:11px; letter-spacing:.2em; color:var(--amber); margin-bottom:7px;
    min-height:14px; text-transform:uppercase;
  }
  #text{font-size:14px; line-height:1.95; min-height:5.6em; white-space:pre-wrap; word-break:break-word;}
  #text .d{color:var(--fog);}            /* 环境/旁白 */
  #text .v{color:var(--cyan);}           /* 收音机里的声音 */
  #text .em{color:var(--gold);}
  #text em{font-style:normal; color:var(--gold);}
  #ell{display:inline-block; width:.62em; height:.95em; background:var(--cyan);
       vertical-align:-2px; animation:bl .55s steps(1,end) infinite; margin-left:2px;}
  @keyframes bl{50%{opacity:0}}
  #choices{margin-top:12px; display:flex; flex-direction:column; gap:6px;}
  .ch{
    text-align:left; cursor:pointer; font:inherit; font-size:13.5px;
    background:#00000033; border:1px solid var(--slate); border-left:4px solid var(--steel);
    color:var(--mist); padding:8px 11px; line-height:1.5;
    transition:background .1s, border-color .1s, transform .06s;
  }
  .ch:hover{background:rgba(44,232,245,.09); border-left-color:var(--cyan); color:var(--white);}
  .ch:active{transform:translateX(2px);}
  .ch .n{color:var(--steel); margin-right:8px;}
  .ch:hover .n{color:var(--cyan);}
  .ch .lk{color:var(--red); font-size:11px; margin-left:6px;}
  #hint{font-size:10px; color:#4d5673; letter-spacing:.12em; margin-top:10px; text-align:right;}
  /* menu */
  #menu{
    position:absolute; inset:0; background:linear-gradient(180deg,rgba(13,11,20,.96),rgba(13,11,20,.99));
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px; z-index:20;
  }
  #menu h1{
    /* text-indent 抵消末字后多出的字距，中文标题才能真的居中 */
    font-size:clamp(26px,7vw,44px); letter-spacing:.36em; text-indent:.36em;
    margin:0 0 2px;
    color:var(--cyan); text-shadow:3px 3px 0 var(--navy), 6px 6px 0 #00000088;
  }
  #menu .sub{font-size:10px; letter-spacing:.42em; color:var(--steel); margin-bottom:16px;}
  #menu .btn2{
    width:min(280px,74vw); padding:10px; font:inherit; font-size:12px; letter-spacing:.24em;
    background:#00000044; border:1px solid var(--panel); color:var(--fog); cursor:pointer;
  }
  #menu .btn2:hover{border-color:var(--cyan); color:var(--cyan); background:rgba(44,232,245,.08);}
  #menu .btn2[disabled]{opacity:.32; cursor:default;}
  #menu .ver{position:absolute; bottom:10px; font-size:9.5px; color:#3f4763; letter-spacing:.16em;}
  #panel{
    position:absolute; inset:0; z-index:30; background:rgba(9,8,15,.97);
    padding:20px; overflow-y:auto; display:none;
    overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
    -webkit-user-select:text; user-select:text;   /* 结局图鉴允许选中复制 */
  }
  #panel h2{font-size:13px; letter-spacing:.24em; color:var(--amber); margin:0 0 14px;}
  .endrow{border-left:3px solid var(--panel); padding:9px 12px; margin-bottom:9px; background:#00000033;}
  .endrow .t{color:var(--mist); font-size:13px; letter-spacing:.1em;}
  .endrow .d{color:var(--fog); font-size:11.5px; margin-top:4px; line-height:1.7;}
  .endrow.got{border-left-color:var(--green);}
  .endrow.got .t{color:var(--gold);}
  #fx{
    position:absolute; inset:0; pointer-events:none; z-index:15; opacity:0;
    background:var(--white);
  }
  #fx.on{animation:flash .5s ease-out;}
  @keyframes flash{0%{opacity:.85}100%{opacity:0}}
  #card{
    position:absolute; inset:0; display:none; z-index:18; pointer-events:none;
    align-items:center; justify-content:center; background:rgba(13,11,20,.88);
  }
  #card.on{display:flex; animation:card 1.9s ease forwards;}
  #card span{
    font-size:clamp(15px,4.2vw,24px); letter-spacing:.32em; color:var(--gold);
    text-shadow:2px 2px 0 var(--navy), 4px 4px 0 #00000088;
    border-top:1px solid var(--panel); border-bottom:1px solid var(--panel);
    padding:11px 20px 11px 24px; text-align:center;
    /* 窄屏上长章节名宁可折行，也不要被容器裁掉半个字 */
    max-width:calc(100% - 28px); box-sizing:border-box;
  }
  @keyframes card{0%{opacity:0}14%{opacity:1}76%{opacity:1}100%{opacity:0}}
  /* ============ 手机 · 竖屏 ============ */
  @media (max-width:560px){
    body{padding:0;}
    #cab{
      height:100vh; height:100dvh;
      max-height:100vh; max-height:100dvh;
      border-left:0; border-right:0; border-top:0;
      /* 安卓外壳会算好刘海高度注入 --sai-*，WebView 报不出值时兜底 */
      padding-top:max(env(safe-area-inset-top), var(--sai-top, 0px));
      padding-left:max(env(safe-area-inset-left), var(--sai-left, 0px));
      padding-right:max(env(safe-area-inset-right), var(--sai-right, 0px));
    }
    /* 手机宽度不够：英文站名会把右侧的「声音 / 菜单」挤出屏幕，直接让位 */
    #bar{padding:8px 10px; gap:7px; font-size:10px; letter-spacing:.06em;}
    #bar b{display:none;}
    #bar .tag{font-size:10px; padding:2px 7px; letter-spacing:.08em;}
    #bar .btn{padding:5px 8px; font-size:10.5px; letter-spacing:.04em;}
    #view{display:flex; align-items:center; justify-content:center;}
    #cv{
      width:100%; height:auto;
      width:min(100%, calc(38vh * 16 / 9));
      width:min(100%, calc(38dvh * 16 / 9));
    }
    #box{padding:14px 15px calc(18px + max(env(safe-area-inset-bottom), var(--sai-bottom, 0px)));}
    #text{font-size:16px; line-height:1.85; min-height:4.6em;}
    #speaker{font-size:11.5px; margin-bottom:8px;}
    #choices{gap:9px; margin-top:14px;}
    .ch{font-size:15px; padding:13px 14px; min-height:48px; border-left-width:5px;}
    .ch .n{margin-right:9px;}
    #hint{font-size:10.5px; margin-top:14px;}
    #menu{gap:11px; padding:20px;}
    #menu h1{font-size:clamp(28px,9vw,40px);}
    #menu .btn2{width:min(320px,82vw); padding:15px; font-size:13px; min-height:52px;}
    #menu .ver{bottom:calc(12px + max(env(safe-area-inset-bottom), var(--sai-bottom, 0px)));}
    #panel{padding:18px 16px calc(24px + max(env(safe-area-inset-bottom), var(--sai-bottom, 0px)));}
    #panel .btn{padding:9px 14px; font-size:12px;}
    #card span{font-size:clamp(16px,5vw,22px); letter-spacing:.24em; padding:12px 14px;}
  }

  /* ============ 手机 · 横屏（画面与文本左右分栏） ============ */
  @media (orientation:landscape) and (max-height:600px){
    body{padding:0;}
    #cab{
      width:100%; max-width:none;
      height:100vh; height:100dvh;
      max-height:none; border-width:0;
      display:grid;
      grid-template-columns:1fr 1fr;
      grid-template-rows:auto 1fr;
      grid-template-areas:"bar bar" "view box";
      padding-left:max(env(safe-area-inset-left), var(--sai-left, 0px));
      padding-right:max(env(safe-area-inset-right), var(--sai-right, 0px));
    }
    #bar{grid-area:bar;}
    #view{
      grid-area:view; display:flex; align-items:center; justify-content:center;
      max-height:none;
    }
    #cv{width:100%; height:auto; max-height:100%; object-fit:contain;}
    /* 章节标题卡默认贴在 #view 里，可横屏时 #view 只占左半边，
       长章节名会被裁掉。改成铺满整个视口，跨两栏居中。 */
    #card{position:fixed; inset:0;}
    #box{
      grid-area:box; border-top:0; border-left:3px solid var(--panel);
      padding:12px 16px calc(12px + max(env(safe-area-inset-right), var(--sai-right, 0px)));
    }
    #text{font-size:15px; line-height:1.8; min-height:3.2em;}
    .ch{font-size:14px; padding:10px 12px; min-height:42px;}
    #choices{gap:6px; margin-top:10px;}
    #menu{gap:8px;}
    #menu h1{font-size:30px; letter-spacing:.3em;}
    #menu .btn2{min-height:44px; padding:10px;}
  }

  /* ============ 触摸设备：干掉粘住的 hover 态，改用按下反馈 ============ */
  @media (hover:none){
    .ch:hover{background:#00000033; border-left-color:var(--steel); color:var(--mist);}
    .ch:active{background:rgba(44,232,245,.14); border-left-color:var(--cyan); color:var(--white);}
    #menu .btn2:hover{border-color:var(--panel); color:var(--fog); background:#00000044;}
    #menu .btn2:active{border-color:var(--cyan); color:var(--cyan); background:rgba(44,232,245,.10);}
    .btn:hover{border-color:var(--steel); color:var(--fog);}
    .btn:active{border-color:var(--cyan); color:var(--cyan);}
  }
</style>
</head>
<body>
<div id="cab">
  <div id="bar">
    <b>ECHO STATION</b>
    <span class="tag" id="chTag">--</span>
    <span class="sp"></span>
    <span class="tag" id="loopTag">循环 00</span>
    <button class="btn" id="bSnd">♪ 声音</button>
    <button class="btn" id="bMenu">≡ 菜单</button>
  </div>

  <div id="view">
    <canvas id="cv" width="192" height="108"></canvas>
    <div id="glow"></div>
    <div id="fx"></div>
    <div id="card"><span id="cardTx"></span></div>
  </div>

  <div id="menu">
    <h1>回声车站</h1>
    <div class="sub">E C H O &nbsp; S T A T I O N</div>
    <button class="btn2" id="mNew">新 的 一 次</button>
    <button class="btn2" id="mCont">继 续 值 班</button>
    <button class="btn2" id="mEnd">结 局 图 鉴</button>
    <div class="ver">K-17 SIGNAL STATION · 1987 · BUILD 0.2 MOBILE</div>
  </div>

  <div id="panel">
    <h2 id="pTitle">结局图鉴</h2>
    <div id="pBody"></div>
    <div style="margin-top:16px"><button class="btn" id="pClose">返回</button></div>
  </div>

  <div id="box">
    <div id="speaker"></div>
    <div id="text"></div>
    <div id="choices"></div>
    <div id="hint"></div>
  </div>
</div>

<script>
/* ==== story.js (inlined) ==== */
/* ============================================================
   《回声车站》剧本数据  ——  写作区
   ------------------------------------------------------------
   改这个文件，保存，刷新浏览器即可看到效果。

   行格式:   [ 角色名, 文本, 样式, 条件 ]
             角色名留空则不显示说话人
             样式  d = 旁白/环境（灰）   v = 收音机电波（青）
                   em = 强调（金）        省略 = 普通白
             条件（可省略）:
                   'ng'    只在二周目及以后出现
                   'f'     只在一周目出现
                   function(S){ return S.flags.xxx; }   自定义条件

   选项:     { t: 文本, to: 节点ID, if: fn(S), set: {flag:true} }
   节点:     { bg, ch, lines, choices, goto, back, ending, onEnter }
   结尾打包: node tools/build.js .   ->  dist/echo-station.html
   ============================================================ */

const T={

/* ==================== 序章 ==================== */

  p1:{bg:'static',ch:'序章',lines:[
    ['','（电流声）','v'],
    ['','……K-17，K-17，请回答。','v'],
    ['','你在值班室的椅子上睁开眼。','d'],
    ['','窗玻璃上结着霜，暖气片早就凉了。桌上那台收音机亮着红色的指示灯，一下，一下。','d'],
    ['','这里是 1987 年的冬天。11 月 3 日。','d'],
    ['','你认得这面霜。同一个位置，同一块形状，连裂纹的走向都一样。','d','ng']
  ],choices:[
    {t:'拿起话筒',to:'p2'},
    {t:'先看清四周',to:'p1_look'}
  ]},

  p1_look:{bg:'room',ch:'序章',lines:[
    ['','值班室不到六平米。一张桌子，一把椅子，三台设备，一扇永远擦不干净的窗。','d'],
    ['','墙上贴着值班表。你走过去。','d']
  ],goto:'p1_roster'},

  p1_roster:{bg:'roster',ch:'序章',lines:[
    ['','值班表是手抄的，格子用尺子比着画，一格一格，很规矩。','d'],
    ['','最后一行写着你的名字，日期是今天。','d'],
    ['','下面还有一行。','d'],
    ['','也是今天。但名字被划掉了，划得很用力，纸都破了。','d'],
    ['','像是有人先写下自己的名字，然后改变主意。','d'],
    ['','收音机还在响。','d'],
    ['','『……请回答。你还有十二分钟。』','v']
  ],choices:[
    {t:'拿起话筒',to:'p2'},
    {t:'再看一眼值班表',to:'p1_again'}
  ]},

  p1_again:{bg:'roster',ch:'序章',lines:[
    ['','你盯着那行被划掉的字。','d'],
    ['','墨迹是湿的。','d'],
    ['','你没有笔。而且这张值班表是今天早上刚换的，纸白得发亮。','d'],
    ['','那么，是谁在四个小时之前，用还没干的墨，写了这个？','d']
  ],choices:[{t:'拿起话筒',to:'p2'}]},

  p2:{bg:'room',ch:'序章',lines:[
    ['','你按下通话键。','d'],
    ['','「这里是 K-17。」','d'],
    ['','收音机安静了一秒。','d'],
    ['','然后里面传出你自己的声音。','d'],
    ['','『这里是 K-17。』','v'],
    ['','一字不差。语调、停顿、连把「七」读成半声的那个习惯，都一样。','d'],
    ['','『别挂断。』那个声音说，『听我说完。这是第十一次了。』','v']
  ],choices:[
    {t:'「什么第十一次？」',to:'p3',set:{asked:true}},
    {t:'挂断',to:'p2_hang'}
  ]},

  p2_hang:{bg:'room',ch:'序章',lines:[
    ['','你挂断了。红灯灭了。','d'],
    ['','三秒后，它自己亮了回来。','d'],
    ['','『你每次都挂断。』那个声音说，听起来很累，『第十一次。』','v'],
    ['','『你挂断，然后你走出去，然后……我在这儿。』','v']
  ],choices:[{t:'「什么第十一次？」',to:'p3',set:{asked:true}}]},

  p3:{bg:'room',ch:'序章',lines:[
    ['','『三点二十七分，会有一列车经过 K-17。』','v'],
    ['','『这条线 1979 年就停运了。可它每次都来，一秒不差。』','v'],
    ['','『它不停车。但如果你站在轨道上，它会带走你。』','v'],
    ['','『你每次都站在那里。』','v'],
    ['','窗外远处传来铁轨的震动。很轻，很慢，像是有什么很重的东西正在醒来。','d'],
    ['','红灯下的时钟：03:15。','d']
  ],choices:[
    {t:'「你是谁？」',to:'p4a'},
    {t:'「我怎么知道你说的是真的？」',to:'p4b'},
    {t:'走向窗户',to:'p4c'}
  ]},

  p4a:{bg:'static',ch:'序章',lines:[
    ['','『我是你。』','v'],
    ['','『准确地说，是三点二十七分之后的你。』','v'],
    ['','停顿。','d'],
    ['','『或者说，是没能走到三点二十七分之后的你。』','v'],
    ['','『我在这条线里待了很久。久到我开始用「它」来称呼这条铁轨。』','v']
  ],set:{knows_self:true},goto:'p5'},

  p4b:{bg:'roster',ch:'序章',lines:[
    ['','『看值班表。』它说，『第三行。』','v'],
    ['','你回头。','d'],
    ['','值班表上多了一行字，墨迹还是湿的。','d'],
    ['','上面只有两个字。','d'],
    ['','「别去」','em']
  ],set:{warning:true},goto:'p5'},

  p4c:{bg:'frost',ch:'序章',lines:[
    ['','你用袖口擦开一块霜。','d'],
    ['','站台是空的。信号灯是绿的。','d'],
    ['','但灯下面站着一个人。','d'],
    ['','背对着你，穿着和你一样的大衣。帽檐上积了一层雪。','d'],
    ['','你数了数，那层雪至少积了一整天。','d'],

    ['','他抬起头看了你一眼，然后低下头，继续等。','d']
  ],goto:'c2_car3'},

  c2_car3:{bg:'carriage',ch:'第二章 · 断线的另一端',lines:[
    ['','你没有认出他的脸。','d'],
    ['','但你认识他的手。','d'],
    ['','左手虎口到手腕，有一道疤，斜着，很深。','d'],
    ['','你小时候见过那道疤。它每天早上给你拧开罐头盖子，然后再把盖子递给你，让你舔一口。','d'],
    ['','你不知道自己是什么时候开始哭的。','d'],
    ['','你没有出声。这节车厢里不适合出声。','d']
  ],goto:'c2_car4'},

  c2_car4:{bg:'carriage',ch:'第二章 · 断线的另一端',lines:[
    ['','他的膝盖上放着一个本子。','d'],
    ['','你伸手去拿。他没有拦你。','d'],
    ['','第一页：「K-17 次，下行，01:05，停车。已完成。」','d'],
    ['','第二页：「K-17 次，上行，03:27，等待通过信号。」','d'],
    ['','「等待」两个字被描过很多遍，笔尖把纸戳穿了。','d'],
    ['','后面每一页都是同一句。','d'],
    ['','一整本，全是同一句。','d'],
    ['','最后一页的页脚上，有一行小字：','d'],
    ['','「孩子，你要是能听见，就把灯给我。」','em'],
    ['','你想起磁带背面那句话：「带子是给外面那位的，不是给你。」','d',function(S){return !!S.flags.tape_secret;}],
    ['','你一直以为是站台上的人。原来不是。','d',function(S){return !!S.flags.tape_secret;}]
  ],set:{carriage:true},goto:'c2_car5'},

  c2_car5:{bg:'carriage',ch:'第二章 · 断线的另一端',lines:[
    ['','你把本子放回他的膝盖上。','d'],
    ['','你站起来，往车门走。','d'],
    ['','走到一半，你回头看了一眼。','d'],
    ['','他还在那里，坐得笔直，帽子放在腿上。','d'],
    ['','四十七个人陪着他。谁也没有说话。','d'],
    ['','你忽然明白了一件事：这列车不是在等人来救它。','d'],
    ['','它在等一句话。','em']
  ],goto:'c2_back'},

  c2_back:{bg:'station',ch:'第二章 · 断线的另一端',lines:[
    ['','你从车上下来。','d'],
    ['','雪落在你肩上，不化。','d'],
    ['','你回头看了一眼那节车厢。顶灯还亮着，很暗，像一粒快烧完的炭。','d'],
    ['','你走回值班室，把门关上。','d']
  ],goto:'ch2'},

  /* ==================== 第三章 · 第八年 ==================== */

  ch3_intro:{bg:'room',ch:'第三章 · 第八年',lines:[
    ['','你把旋钮拧到底，又拧回来。','d'],
    ['','收音机里的雪声变了。','d'],
    ['','不再是沙沙声，是一种很低的、有节奏的声音。','d'],
    ['','像是有人在很远的地方，用指节敲桌子。','d'],
    ['','三下。停。三下。停。','d'],
    ['','你听过这个节奏。这是电报的呼号。','d','ng'],
    ['','你在这台机器上听过四十一次「别去」。','d',function(S){return !!S.flags.tape_deep;}],
    ['','那四十一个声音，其实都是同一个人在说。','d',function(S){return !!S.flags.tape_deep;}],
    ['','你把手放在收音机上。','d'],
    ['','它有一点温。','em']
  ],goto:'ch3_a'},

  ch3_a:{bg:'room',ch:'第三章 · 第八年',lines:[
    ['','你不知道该说什么，就说了最简单的一句。','d'],
    ['','「我听见了。」','d'],
    ['','敲击声停了。','d'],
    ['','然后那个声音回来了。是那个疲惫的、你的声音。','d'],
    ['','『……你听见了什么？』','v'],
    ['','你想了想。','d'],
    ['','「你在等一个信号。」','d'],
    ['','长时间的沉默。','d'],
    ['','『谁告诉你的？』','v']
  ],goto:'ch3_b'},

  ch3_b:{bg:'room',ch:'第三章 · 第八年',lines:[
    ['','「我自己看见的。」','d'],
    ['','『你在哪儿看见的？』','v'],
    ['','「隧道口。第十四节车厢。」','d'],
    ['','沉默。这次的沉默很长，长到你以为它不会再开口了。','d'],
    ['','然后它说了一句你没想到的话。','d'],
    ['','『你母亲，她还在等你吃饭吗？』','v'],
    ['','你想起那通电话。广播说的是「请值班员做好准备」。','d',function(S){return !!S.flags.heard_broadcast;}],
    ['','八个字，八年。','d',function(S){return !!S.flags.heard_broadcast;}]
  ],goto:'ch3_c'},

  ch3_c:{bg:'room',ch:'第三章 · 第八年',lines:[
    ['','你愣住了。','d'],
    ['','因为这个问题不对。','d'],
    ['','如果它真的是「三点二十七分之后的你」，它应该知道答案。','d'],
    ['','它应该知道后来八年里都发生了什么。它应该知道你今天早上吃的是什么。','d'],
    ['','它不知道。','d'],
    ['','它只知道 1979 年 11 月 3 日以前的事。','d'],
    ['','因为它就是从那天来的。','em'],
    ['','「我是你。」——序章的时候，它是这么说的。','d',function(S){return !!S.flags.knows_self;}],
    ['','它没有撒谎。只是它说的那个「你」，指的不是你。','d',function(S){return !!S.flags.knows_self;}]
  ],goto:'ch3_d'},

  ch3_d:{bg:'roster',ch:'第三章 · 第八年',lines:[
    ['','你走过去，翻开值班表的第一页。','d'],
    ['','纸很脆，边上卷起来了，一碰就掉渣。','d'],
    ['','第一行，1979 年 11 月 3 日，夜班。','d'],
    ['','值班员一栏，名字被涂掉了，涂得很厚，几乎把纸涂穿。','d'],
    ['','你把它举到灯下，侧着看了一会儿。','d'],
    ['','还是看出来了。','d'],
    ['','因为那个字的写法你太熟了——你小时候学写字，描的就是他的字。','d']
  ],goto:'ch3_e'},

  ch3_e:{bg:'roster',ch:'第三章 · 第八年',lines:[
    ['','三个字。','d'],
    ['','中间那个字，竖钩写得特别长，收笔的时候会往上挑一下。','d'],
    ['','你写自己名字的时候，也是这么写的。','d'],
    ['','你从来没有刻意学过。你只是从小看他写。','d'],
    ['','他姓你的姓。','em'],
    ['','他是你父亲。','em'],
    ['','你想起发报机上那一下——你敲自己的名字，有人替你敲完了最后一个字。','d',function(S){return !!S.flags.sent_name;}],
    ['','现在你知道是谁的手了。','d',function(S){return !!S.flags.sent_name;}]
  ],goto:'ch3_f'},

  ch3_f:{bg:'room',ch:'第三章 · 第八年',lines:[
    ['','收音机还在响，还在等。','d'],
    ['','现在你知道它在等什么了。','d'],
    ['','它在等一句「可以了」。','d'],
    ['','八年里，没有一个值班的人对它说过这句话。','d'],
    ['','因为每一个值班的人都以为，那只是一台坏掉的收音机。','d'],
    ['','而每一个值班的人，在凌晨三点二十七分，都会走出去，站到轨道上。','d'],
    ['','然后他们也留在了这里。','d'],
    ['','和他们一起的，还有四十七个人。','d','ng'],
    ['','你发过「别来」两个字。现在你知道那是发给谁的了。','d',function(S){return !!S.flags.sent_stop;}],
    ['','也知道了它为什么只回你一句「第一次」。','d',function(S){return !!S.flags.sent_stop;}],
    ['','你在最开始问过它一句「什么第十一次」。','d',function(S){return !!S.flags.asked;}],
    ['','它没有回答。有些数字，说出来也只是数字。','d',function(S){return !!S.flags.asked;}]
  ],goto:'ch3_choice'},

  ch3_choice:{bg:'room',ch:'第三章 · 第八年',lines:[
    ['','墙上的钟：03:26。','d'],
    ['','你说什么？','em']
  ],choices:[
    {t:'叫他的名字',to:'ch3_name'},
    {t:'「你在哪一节车厢？」',to:'ch3_car'},
    {t:'什么也不说',to:'ch3_silent'}
  ]},

  ch3_name:{bg:'room',ch:'第三章 · 第八年',lines:[
    ['','你把那三个字说出来了。','d'],
    ['','你叫了他一声。像小时候叫他从院子里回来吃饭那样。','d'],
    ['','收音机里的雪声整片地抖了一下，像是有人碰翻了什么。','d'],
    ['','然后是很长的安静。','d'],
    ['','八年来第一次，那台收音机没有回话。','d'],
    ['','它只是亮着。','d'],
    ['','亮着，像一个人终于把憋了很久的那口气，慢慢吐了出来。','d']
  ],set:{said_name:true},goto:'final'},

  ch3_car:{bg:'room',ch:'第三章 · 第八年',lines:[
    ['','「你在哪一节车厢？」','d'],
    ['','又是很长的沉默。','d'],
    ['','『……我不知道。』','v'],
    ['','『我一直在找。我数过很多遍，可每次数完，车厢就又多一节。』','v'],
    ['','『我怕的不是数不完。』','v'],
    ['','『我怕的是，我数完了，也没人来。』','v']
  ],goto:'final'},

  ch3_silent:{bg:'room',ch:'第三章 · 第八年',lines:[
    ['','你什么都没说。','d'],
    ['','收音机等了一会儿。','d'],
    ['','然后它说：','d'],
    ['','『……好。』','v'],
    ['','『那就再等一次。』','v']
  ],goto:'final'},

  /* ==================== 终章 · 三点二十七分 ==================== */

  final:{bg:'room',ch:'终章 · 三点二十七分',lines:[
    ['','三点二十六分。','d'],
    ['','五十九秒。','d'],
    ['','铁轨开始震动。','d'],
    ['','不是列车的声音，是雪被压实的声音。一脚，一脚。','d'],
    ['','有人正在沿着铁轨，走向这间屋子。','d'],
    ['','你站起来。椅子在地上刮了一声。','d']
  ],goto:'final_see'},

  final_see:{bg:'frost',ch:'终章 · 三点二十七分',lines:[
    ['','你擦开霜。','d'],
    ['','站台上站着一个人。','d'],
    ['','背对着你。他穿着你的大衣，帽子上的雪积了一整天那么厚。','d'],
    ['','你见过这个背影。刚醒来的那天，你在结霜的窗上就见过。','d',function(S){return !!S.flags.saw_figure;}],
    ['','他慢慢转过身。','d'],
    ['','你看不清他的脸，但你看得清他在摇头。','d'],
    ['','你想起值班表上那两个字。','d',function(S){return !!S.flags.warning;}],
    ['','「别去」。写的时候，他大概也知道没有人会听。','d',function(S){return !!S.flags.warning;}],
    ['','站台上站着两个人。','d',function(S){return !!S.flags.carriage;}],
    ['','一个背对着你，一个坐在站台边上，把帽子放在腿上。','d',function(S){return !!S.flags.carriage;}],
    ['','这一次你会看清他们的。','d',function(S){return !!S.flags.carriage;}]
  ],goto:'final_choice'},

  final_choice:{bg:'train',ch:'终章 · 三点二十七分',lines:[
    ['','远处，铁轨亮成一条线。','d'],
    ['','墙上的钟：03:26:50。','d'],
    ['','你不是第一次做这个选择。但你是第一次知道自己在选择什么。','d','ng']
  ],choices:[
    {t:'开门走出去，站到轨道上',to:'end_repeat'},
    {t:'锁上门，拉开椅子坐下',to:'end_stay'},
    {t:'抓起听筒，对着收音机喊话',to:'end_echo'},
    {t:'从后门出去，爬上信号塔，把灯扳成红的',to:'end_after'},
    {t:'先对着收音机，把该说的话说完',to:'end_home',if:function(S){
      return !!(S.flags.said_name && S.flags.box);
    }}
  ]},

  /* ==================== 结局 ==================== */

  end_repeat:{bg:'train',ch:'结局',lines:[
    ['','你走出去。','d'],
    ['','雪没到脚踝。信号灯还是绿的，绿得像一句谎。','d'],
    ['','你站到轨道正中，面朝来车的方向。','d'],
    ['','你想，这一次总该不一样了吧。','d'],
    ['','灯到了。','d'],
    ['','然后是一片黑。','d'],
    ['','再睁开眼的时候，窗玻璃上结着霜，暖气片早就凉了。','d'],
    ['','桌上的收音机亮着红色的指示灯。','d'],
    ['','一下，一下。','d'],
    ['','『……K-17，K-17，请回答。』','v'],
    ['','你走进那节车厢，找了个位置坐下。','d','ng'],
    ['','你数了数。你是第四十八个。','d','ng']
  ],ending:{id:'repeat',t:'第十二次',d:'你选择了最熟的那条路。循环不会因为你勇敢而奖励你，它只会因为你重复而延长。四十七个人又等了一年，而其中多了一个你。'}},

  end_stay:{bg:'room',ch:'结局',lines:[
    ['','你锁上门。','d'],
    ['','搬了椅子，背对着窗，坐下。','d'],
    ['','你决定什么都不做。','d'],
    ['','铁轨的震动从椅子里传上来，穿过脊椎，一直震到牙齿。','d'],
    ['','三点二十七分。','d'],
    ['','列车经过了。','d'],
    ['','没有停。','d'],
    ['','三点二十八分。','d'],
    ['','收音机安静了。红灯灭了。窗外的天开始泛白。','d'],
    ['','你活过了三点二十七分。','d'],
    ['','天亮以后，你去了隧道口。','d'],
    ['','那节车厢还在那里，冰又厚了一层。','d'],
    ['','你站在雪里看了一会儿，然后回屋，泡了今天的第一杯茶。','d'],
    ['','值班表上多了一行字，是你的笔迹：','d'],
    ['','「11月4日，晴。无异常。」','em']
  ],ending:{id:'stay',t:'静默',d:'活下去是最低成本的答案，也是最贵的。你保住了自己，代价是承认那四十七个人与你无关——包括坐在最后一排的那一个。'}},

  end_echo:{bg:'static',ch:'结局',lines:[
    ['','你抓起听筒，对着收音机喊。','d'],
    ['','「我在。我在听。说下去。」','d'],
    ['','雪花噪声抖了一下。','d'],
    ['','『你终于回话了。』','v'],
    ['','『十一次，你都在听，但你从来没有回答过。』','v'],
    ['','『听着——三点二十七分的不是火车。』','v'],
    ['','『是这段广播本身。它每晚会播一次，播给下一个值班的人。』','v'],
    ['','『而我们说的话，会变成明天的广播。』','v'],
    ['','『所以别再喊「别去」了。喊点有用的。』','v'],
    ['','窗外的灯已经照到墙上了。','d'],
    ['','你只有几秒钟。','d']
  ],choices:[
    {t:'「往北走，走到隧道口。那儿有一节车厢。」',to:'echo_a'},
    {t:'「别听收音机。天亮前不要开机。」',to:'echo_b'}
  ]},

  echo_a:{bg:'tunnel',ch:'结局',lines:[
    ['','你喊出了方向。','d'],
    ['','灯淹没了房间。','d'],
    ['','——','d'],
    ['','1988 年冬天，一个年轻人坐上这个岗位。','d'],
    ['','凌晨三点十五分，收音机自己亮了。','d'],
    ['','他听见一个不认识的声音说：','d'],
    ['','『往北走，走到隧道口。那儿有一节车厢。』','v'],
    ['','他不知道为什么，但他站起来，拿上手电，往北走。','d'],
    ['','——','d'],
    ['','第二年春天，铁路部门清理废弃线路。','d'],
    ['','他们在隧道口找到了一列冻在冰里的客车。十四节，四十七名乘客。','d'],
    ['','官方记录写的是：「因线路停运滞留，无人员伤亡。」','d'],
    ['','但清理的人说，最后一排坐着一个穿制服的，手里攥着一个本子。','d'],
    ['','本子最后一页是新的，墨还没干：','d'],
    ['','「有人来了。」','em']
  ],ending:{id:'echo_a',t:'回声 · 往北',d:'你没有逃出去，但你把自己变成了一条路标。循环还在转，只是这一次，终于有人拿着它找到了那节车厢。'}},

  echo_b:{bg:'tunnel',ch:'结局',lines:[
    ['','你喊出了办法。','d'],
    ['','灯淹没了房间。','d'],
    ['','——','d'],
    ['','1988 年冬天，一个年轻人坐上这个岗位。','d'],
    ['','他听见收音机响，伸手去按。','d'],
    ['','然后他停住了。','d'],
    ['','因为他昨天刚在值班表上看见一行陌生的字：','d'],
    ['','「天亮前不要开机。」','em'],
    ['','他坐回椅子上，抱着膝盖，等天亮。','d'],
    ['','三点二十七分，铁轨震动了很久。','d'],
    ['','但他什么都没听见。','d'],
    ['','天亮的时候，收音机再也没亮过。','d'],
    ['','他以为那是个坏掉的机器，第二年申请调走了。','d'],
    ['','这条线上的最后一个值班员，从这天起，什么都不知道地活着。','d']
  ],ending:{id:'echo_b',t:'回声 · 关机',d:'最温柔的一种胜利：不给后来者任何戏剧性的机会，只给他一个安静的夜。代价是他永远不会知道那节车厢，也就不会有人再叫醒他们。'}},

  end_after:{bg:'dawn',ch:'结局',lines:[],onEnter:function(){
    if(S.flags.box) route('after_win'); else route('after_gone');
  }},

  after_win:{bg:'dawn',ch:'结局',lines:[
    ['','你从后门出去，没有看站台。','d'],
    ['','雪很厚，梯子很滑。爬到塔顶的时候，你的手指已经没有知觉了。','d'],
    ['','你抓住塔顶的横杆，用全部力气把它转了半圈。','d'],
    ['','信号灯从绿变成红。','d'],
    ['','红灯只有一个意思：这条线已经停运。','d'],
    ['','远处，那条正在逼近的亮线停住了。','d'],
    ['','不是减速，是停住。像是有人把一根线掐断了。','d'],
    ['','然后灯灭了。','d'],
    ['','车厢一节一节地安静下来，从最后一节开始，往前往后。','d'],
    ['','你听见一个声音。不是收音机，不是广播。','d'],
    ['','是很多个人同时松了一口气。','d'],
    ['','四十七声。','em'],
    ['','——','d'],
    ['','你从塔上下来的时候，天已经亮了。','d'],
    ['','站台上空了。轨道上只剩两行脚印，一行往外，一行往站台。','d'],
    ['','你回到值班室。','d'],
    ['','桌上放着那个本子。','d'],
    ['','你没有看见是谁放的。','d'],
    ['','你翻开最后一页。上面多了一行字，写得端端正正，一笔一划，像在教小孩子写字：','d'],
    ['','「K-17 次，上行，03:27，已通过。值班员：（签名）」','em'],
    ['','签名是你的名字。','d'],
    ['','是他的笔迹。','d']
  ],goto:'after_win2'},

  after_win2:{bg:'dawn',ch:'结局',lines:[
    ['','K-17 从此没有人值过班。','d'],
    ['','这条线在地图上还留着，但再没有列车经过。','d'],

/* ---------- 0. 工具 ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);

/* ---------- 1. 调色板 (8-bit / Endesga 风) ---------- */

g.imageSmoothingEnabled=false;
function r(x,y,w,h,c){ if(w<=0||h<=0) return; g.fillStyle=c; g.fillRect(x|0,y|0,Math.max(1,w|0),Math.max(1,h|0)); }

}
function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mix(a,b,t){
  const A=hex2rgb(a),B=hex2rgb(b);

}
function stars(seed,count,maxY){
  const rnd=mulberry32(seed);

function snow(seed,count,t,speed,color){
  const rnd=mulberry32(seed);

  }

}

  }
}

  for(let i=0;i<90;i++){ const x=(rnd()*VW)|0,yy=y+(rnd()*(VH-y))|0; r(x,yy,1,1,top); }

/* ---------- 4. 声音 ---------- */
let AC=null, sndOn=true, droneGain=null;
function actx(){
  if(!AC){
    try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function blip(freq,dur,type,vol){
  if(!sndOn) return; const a=actx(); if(!a) return;
  freq=freq||520; dur=dur||0.028; type=type||'square'; vol=vol||0.045;
  const o=a.createOscillator(), gn=a.createGain();
  o.type=type; o.frequency.value=freq;
  gn.gain.setValueAtTime(0,a.currentTime);
  gn.gain.linearRampToValueAtTime(vol,a.currentTime+0.004);
  gn.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  o.connect(gn); gn.connect(a.destination); o.start(); o.stop(a.currentTime+dur+0.01);
}
function noiseBurst(dur,vol){
  if(!sndOn) return; const a=actx(); if(!a) return;
  dur=dur||0.2; vol=vol||0.06;
  const n=a.sampleRate*dur|0, buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(); s.buffer=buf;
  const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1400; f.Q.value=0.7;
  const gn=a.createGain(); gn.gain.value=vol;
  s.connect(f); f.connect(gn); gn.connect(a.destination); s.start();
}
function chord(freqs){
  if(!sndOn) return;
  freqs.forEach(function(f,i){ setTimeout(function(){ blip(f,0.09,'square',0.032); },i*55); });
}
function startDrone(){
  if(!sndOn) return; const a=actx(); if(!a||droneGain) return;
  droneGain=a.createGain(); droneGain.gain.value=0.016; droneGain.connect(a.destination);
  [55,82.5,110].forEach(function(f,i){
    const o=a.createOscillator(); o.type='triangle'; o.frequency.value=f;
    const gn=a.createGain(); gn.gain.value=i===2?0.4:1;
    o.connect(gn); gn.connect(droneGain); o.start();
  });
}
function stopDrone(){
  if(droneGain){ try{ droneGain.disconnect(); }catch(e){} droneGain=null; }
}

const SAVEKEY='echostation.save.v1';
let S={node:'start',flags:{},loops:0,seen:{},ends:{},time:0};

function newRun(keepMeta){
  const meta = keepMeta ? {ends:S.ends, loops:S.loops} : {ends:{}, loops:0};
  S={node:'p1',flags:{},loops:meta.loops,seen:{},ends:meta.ends,time:0};
  lastCardCh=null;
  goto('p1');
}
function save(){
  try{ localStorage.setItem(SAVEKEY, JSON.stringify({node:S.node,flags:S.flags,loops:S.loops,seen:S.seen,ends:S.ends})); }catch(e){}
}
function load(){
  try{
    const raw=localStorage.getItem(SAVEKEY); if(!raw) return null;
    const o=JSON.parse(raw); if(!o||!o.node) return null; return o;
  }catch(e){ return null; }
}

/* ---------- 7. 引擎 ---------- */
const elText=document.getElementById('text');
const elSpk=document.getElementById('speaker');
const elCh=document.getElementById('choices');
const elChTag=document.getElementById('chTag');
const elLoop=document.getElementById('loopTag');

const elFx=document.getElementById('fx');

let cur=null, lines=[], li=0, typing=false, typer=null, full='', curStyle='d', curWho='';
let curOpts=[];
let curBg='static';
let lastCardCh=null;

function showCard(txt){
  const c=document.getElementById('card');
  document.getElementById('cardTx').textContent=txt;
  c.classList.remove('on'); void c.offsetWidth; c.classList.add('on');
  buzz([16,46,16]);
  blip(196,0.22,'triangle',0.05);
}

function goto(id){
  const node=T[id];
  if(!node){ console.warn('missing node',id); return; }
  S.node=id;
  if(!S.seen[id]) S.seen[id]=0;
  S.seen[id]++;
  cur=node; li=0;
  curBg=node.bg||(cur.bg||'room');
  elChTag.textContent=(node.ch||'--').split(' · ')[0];
  elLoop.textContent='循环 '+String(S.loops).padStart(2,'0');
  if(node.ch && node.ch!=='结局' && node.ch!==lastCardCh){ lastCardCh=node.ch; showCard(node.ch); }
  if(node.onEnter){ node.onEnter(); return; }
  lines=(node.lines||[]).filter(function(L){
    const tag=L[3];
    if(tag===undefined||tag===null) return true;
    if(typeof tag==='function'){ try{ return !!tag(S); }catch(e){ return false; } }
    if(tag==='ng') return S.loops>0;    /* 只在二周目及以后出现 */
    if(tag==='f')  return S.loops===0;  /* 只在一周目出现 */
    return true;
  });
  if(lines.length===0){ afterLines(); return; }
  showLine();
  save();
}
function route(id){ goto(id); }

function showLine(){
  const L=lines[li];
  if(!L){ afterLines(); return; }
  curWho=L[0]||''; full=L[1]||''; curStyle=L[2]||'d';
  elSpk.textContent=curWho? ('▌ '+curWho) : (curStyle==='v'?'▌ 收音机':'');
  elCh.innerHTML='';
  curOpts=[];
  elHint.style.visibility='hidden';
  typeOut(full,curStyle);
}
function typeOut(str,style){
  typing=true; elText.innerHTML='';
  const span=document.createElement('span'); span.className=style;
  elText.appendChild(span);
  const ell=document.createElement('span'); ell.id='ell';
  let i=0;
  const speed = style==='v'? 34 : (style==='em'? 62 : 26);
  clearInterval(typer);
  let tick=0;
  typer=setInterval(function(){
    if(i>=str.length){ finishTyping(); return; }
    const ch=str[i++];
    span.textContent+=ch;
    if(tick++%2===0) blip(style==='v'? 300+Math.random()*70 : 520+Math.random()*80, 0.018,'square',0.022);
    if(style==='v' && Math.random()>0.94) noiseBurst(0.03,0.012);
  },speed);
  elText.appendChild(ell);
}
function finishTyping(){
  clearInterval(typer);
  elText.innerHTML='<span class="'+curStyle+'">'+esc(full)+'</span><span id="ell"></span>';
  typing=false;
}
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function nextLine(){
  if(typing){ finishTyping(); return; }
  li++;
  if(li<(lines||[]).length){ showLine(); }
  else { afterLines(); }
}
function afterLines(){
  const node=cur;
  if(node.ending){ showEnding(node.ending); return; }
  if(node.goto){ goto(node.goto); return; }
  if(node.back){ goto(node.back); return; }
  const opts=(node.choices||[]).filter(function(c){
    if(c.if && !c.if(S)) return false;
    return true;
  });
  renderChoices(opts);
}
function renderChoices(opts){
  elCh.innerHTML='';
  elHint.style.visibility='visible';
  if(!opts.length){ elCh.innerHTML='<div style="color:#5a6988;font-size:12px">（没有可选的行动）</div>'; return; }
  chord([440,554,659]);
  opts.forEach(function(o,i){
    const b=document.createElement('button');
    b.className='ch';
    b.innerHTML='<span class="n">'+(i+1)+'</span>'+esc(o.t)+(o.lk?'<span class="lk">'+esc(o.lk)+'</span>':'');
    b.onclick=function(){ pick(o); };
    elCh.appendChild(b);
  });
  curOpts=opts;
}
let choicesReadyAt=0;
function pick(o){
  if(!o) return;
  /* 防连点误触：选项刚出现的 260ms 内不响应，避免「点继续」那一下顺手选中了选项 */
  if(performance.now()<choicesReadyAt) return;
  choicesReadyAt=0;
  buzz(10);
  blip(700,0.05,'square',0.05);
  if(o.run){ o.run(); return; }
  if(o.set) Object.assign(S.flags,o.set);
  if(o.to) goto(o.to);
}

function showEnding(e){
  if(!S.ends[e.id]) S.ends[e.id]={t:e.t,d:e.d,n:0};
  S.ends[e.id].n++;
  S.loops++;
  elFx.classList.remove('on'); void elFx.offsetWidth; elFx.classList.add('on');
  noiseBurst(0.7,0.1);
  setTimeout(function(){
    elSpk.textContent='▌ 结局达成';
    elText.innerHTML='<span class="em" style="color:var(--gold)">◆ '+esc(e.t)+' ◆</span>\n\n'+esc(e.d);
    elCh.innerHTML='';
    elHint.style.visibility='visible';
    const o1={run:function(){ newRun(true); }};
    const o2={run:function(){ openMenu(); }};
    const b1=document.createElement('button'); b1.className='ch';
    b1.innerHTML='<span class="n">1</span>再来一次（保留记忆）';
    b1.onclick=function(){ pick(o1); };
    const b2=document.createElement('button'); b2.className='ch';
    b2.innerHTML='<span class="n">2</span>回到菜单';
    b2.onclick=function(){ pick(o2); };
    elCh.appendChild(b1); elCh.appendChild(b2);
    curOpts=[o1,o2];
    choicesReadyAt=performance.now()+300;
    save();
  },620);
}

/* ---------- 8. 输入 ---------- */
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const HAS_PE = !!window.PointerEvent;

/* 轻微震动反馈（不支持的设备自动忽略） */
/* 轻微震动反馈：优先走原生桥（WebView 里的 navigator.vibrate 时灵时不灵） */
function buzz(p){
  try{
    if(window.EchoNative && EchoNative.buzz){
      var ms = (typeof p==='number') ? p : (p && p.length ? p[0] : 0);
      EchoNative.buzz(Math.round(ms));
      return;
    }
    if(navigator.vibrate) navigator.vibrate(p);
  }catch(e){}
}

function panelOpen(){ return document.getElementById('panel').style.display==='block'; }
function canAdvance(){ return !menuOpen && !panelOpen(); }
function tapAdvance(){
  if(!canAdvance()) return;
  if(typing){ finishTyping(); return; }
  if(curOpts.length) return;
  nextLine();
}
function onInteractive(t){
  return !!(t && t.closest &&
    (t.closest('.ch')||t.closest('button')||t.closest('#menu')||t.closest('#panel')));
}

document.addEventListener('keydown',function(e){
  if(menuOpen) return;
  if(e.key===' '||e.key==='Enter'){
    e.preventDefault();
    if(typing){ finishTyping(); return; }
    if(curOpts.length) return;
    nextLine(); return;
  }
  const n=parseInt(e.key,10);
  if(n>=1&&n<=9){
    if(typing){ finishTyping(); return; }
    const b=elCh.children[n-1];
    if(b && b.className==='ch' && curOpts[n-1]) pick(curOpts[n-1]);
  }
});
/* 指针统一处理：鼠标走点击，手指走「轻点 / 上滑 / 左滑」 */
const cabEl=document.getElementById('cab');
const boxEl=document.getElementById('box');
let pStart=null, pMoved=false, lastTouchAt=0;

if(HAS_PE){
  cabEl.addEventListener('pointerdown',function(e){
    pStart=null; pMoved=false;
    if(e.pointerType==='mouse') return;
    if(!canAdvance()) return;
    if(onInteractive(e.target)) return;      /* 点在按钮/菜单上，交给它们自己处理 */
    pStart={x:e.clientX,y:e.clientY,t:Date.now()};
  },{passive:true});

  cabEl.addEventListener('pointermove',function(e){
    if(!pStart) return;
    if(Math.abs(e.clientX-pStart.x)>12||Math.abs(e.clientY-pStart.y)>12) pMoved=true;
  },{passive:true});

  cabEl.addEventListener('pointerup',function(e){
    if(e.pointerType!=='mouse') lastTouchAt=Date.now();
    if(!pStart||e.pointerType==='mouse'){ pStart=null; return; }
    const dx=e.clientX-pStart.x, dy=e.clientY-pStart.y, dt=Date.now()-pStart.t;
    pStart=null;
    if(!canAdvance()) return;
    /* 上滑：仅当正文已滚到底才算「跳过」，否则让页面照常滚动 */
    if(dy<-46 && Math.abs(dy)>Math.abs(dx) &&
       boxEl.scrollTop+boxEl.clientHeight>=boxEl.scrollHeight-4){
      tapAdvance(); return;
    }
    /* 左滑：跳过打字机 */
    if(dx<-46 && Math.abs(dx)>Math.abs(dy)){ if(typing) finishTyping(); return; }
    /* 轻点：翻页 / 补全当前这句 */
    if(!pMoved && dt<450) tapAdvance();
  },{passive:true});

  cabEl.addEventListener('pointercancel',function(){ pStart=null; },{passive:true});
}

boxEl.addEventListener('click',function(e){
  if(Date.now()-lastTouchAt<700) return;   /* 触摸已被指针事件消化，避免一次轻点翻两页 */
  if(e.target.closest('.ch')) return;
  if(menuOpen) return;
  if(typing){ finishTyping(); return; }
  if(curOpts.length) return;
  nextLine();
});

  S.node=sv.node; S.flags=sv.flags||{}; S.loops=sv.loops||0;
  S.ends=sv.ends||{}; S.seen=sv.seen||{};
  closeMenu(); goto(sv.node);
};
document.getElementById('mEnd').onclick=function(){
  const got=S.ends||{};
  let h='';
  ENDLIST.forEach(function(e){
    const g=got[e.id];
    if(g){ h+='<div class="endrow got"><div class="t">◆ '+esc(e.t)+' ('+g.n+')</div><div class="d">'+esc(e.d||'')+'</div></div>'; }
    else if(e.secret){ h+='<div class="endrow"><div class="t">◇ ???</div><div class="d">隐藏结局 · 需要两件事：在第三章叫出他的名字，并且带上桌子底下那个铁盒里的东西。</div></div>'; }
    else { h+='<div class="endrow"><div class="t">◇ ???</div><div class="d">尚未抵达。</div></div>'; }
  });
  document.getElementById('pBody').innerHTML=h;
  elPanel.style.display='block';
};
document.getElementById('pClose').onclick=function(){ elPanel.style.display='none'; };
document.getElementById('bMenu').onclick=function(){ openMenu(); };
document.getElementById('bSnd').onclick=function(){
  sndOn=!sndOn;
  this.textContent = sndOn? '♪ 声音' : '× 静音';
  this.style.color = sndOn? '' : '#e43b44';
  if(sndOn){ startDrone(); blip(660,0.06); } else { stopDrone(); }
};

/* ---------- 10. 主循环 ---------- */
let t0=performance.now();
function loop(now){
  const t=now-t0;
  S.time=t;
  const fn=SC[curBg]||SC.room;
  fn(t);
  requestAnimationFrame(loop);
}
/* 启动。
   附带两个开发/写作时的快捷参数（手机上也常用）：
     ?node=<节点id>   跳过菜单，直接落到某个节点（改完剧本想单看某段时很方便）
     ?mute=1          静音启动
   例：index.html?node=ch3_c */
let bootNode='p1', bootAuto=false;
try{
  const q=new URLSearchParams(location.search);
  const n=q.get('node');
  if(n && T[n]){ bootNode=n; bootAuto=true; }
  if(q.get('mute')==='1'){
    sndOn=false;
    document.getElementById('bSnd').textContent='× 静音';
    document.getElementById('bSnd').style.color='#e43b44';
  }
}catch(err){}

if(bootAuto){
  menuOpen=false; elMenu.style.display='none';
  S={node:bootNode,flags:{},loops:0,seen:{},ends:{},time:0};
  lastCardCh=null;
  goto(bootNode);
}else{
  openMenu();
  goto('p1');
}
requestAnimationFrame(loop);

/* ---------- 11. 移动端增强 ---------- */

/* 提示文案按设备切换 */
elHint.innerHTML = IS_TOUCH
  ? '轻点画面继续 &nbsp;·&nbsp; 上滑跳过'
  : '空格/回车 继续 &nbsp;·&nbsp; 数字键 选择';

/* 触摸设备上点菜单时顺手请求全屏（iPhone Safari 不支持，静默失败即可） */
function goFullscreen(){
  if(window.EchoNative) return;   /* 安卓外壳已全屏，方向交给 manifest，别重复请求 */
  try{
    const de=document.documentElement;
    if(!document.fullscreenElement && de.requestFullscreen) de.requestFullscreen().catch(function(){});
    if(screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(function(){});
  }catch(err){}
}
if(IS_TOUCH) document.getElementById('menu').addEventListener('click',goFullscreen);

/* 屏幕常亮：一局要玩半小时，别让它中途黑屏 */
let wakeLock=null;
function keepAwake(){
  try{
    if(!navigator.wakeLock) return;
    navigator.wakeLock.request('screen').then(function(wl){
      wakeLock=wl;
      wl.addEventListener('release',function(){ wakeLock=null; });
    }).catch(function(){});
  }catch(err){}
}
if(IS_TOUCH) document.addEventListener('pointerdown',function once(){
  document.removeEventListener('pointerdown',once);
  keepAwake();
},{passive:true});

/* 切到后台：停掉嗡鸣并冻结画面时间；回到前台再续上 */
document.addEventListener('visibilitychange',function(){
  if(document.hidden){ stopDrone(); }
  else{
    t0=performance.now()-S.time;
    if(sndOn && !menuOpen) startDrone();
    if(IS_TOUCH && !wakeLock) keepAwake();
  }
});

/* Safari 双指缩放兜底 */
['gesturestart','gesturechange','gestureend'].forEach(function(ev){
  document.addEventListener(ev,function(e){ e.preventDefault(); },{passive:false});
});

/* PWA：只在 http(s) 下注册 Service Worker（用 file:// 打开时自动跳过） */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

/* ---------- 安卓外壳：接管返回键 ----------
   有面板就关面板，没菜单就开菜单，两者都不是才真的退出。
   原生侧拿到 'exit' 才会 finish()。 */
window.EchoAndroidBack = function(){
  try{
    if(panelOpen()){ elPanel.style.display='none'; return 'handled'; }
    if(!menuOpen){ openMenu(); return 'handled'; }
    return 'exit';
  }catch(e){ return 'exit'; }
};
</script>
